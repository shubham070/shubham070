name: Generate Contribution Snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write   # give the workflow permission to push to the repo

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Generate placeholder SVG
        shell: bash
        run: |
          mkdir -p .github
          cat > .github/contribution-snake.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="720" height="120">
            <rect width="100%" height="100%" fill="#0b1220"/>
            <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="Segoe UI, Roboto, sans-serif" font-size="16" fill="#9AA3B2">Contribution Snake for shubham070</text>
            <text x="50%" y="70%" dominant-baseline="middle" text-anchor="middle" font-family="Segoe UI, Roboto, sans-serif" font-size="10" fill="#9AA3B2">Generated: $(date -u +"%Y-%m-%d %H:%M:%SZ")</text>
          </svg>
          SVG

      - name: Commit and push SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/contribution-snake.svg
          git status --porcelain
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: generate contribution-snake.svg [skip ci]"
            # debug info in case push fails
            git remote -v
            echo "GITHUB_REF=${GITHUB_REF}"
            GIT_TRACE=1 GIT_CURL_VERBOSE=1 git push origin HEAD:${{ github.ref_name || 'main' }}
          fi
